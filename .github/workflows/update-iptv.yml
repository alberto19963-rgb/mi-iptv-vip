name: Actualizador Diario de IPTV

on:
  push:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8:00 AM UTC (4:00 AM AST/EST)
  workflow_dispatch: # Permite que lo ejecutes manualmente con un botón

jobs:
  update-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Ejecutar la limpieza de canales muertos
        run: python update_channels.py

      - name: Subir los cambios a GitHub (Commit y Push)
        run: |
          git config --global user.name "IPTV Bot"
          git config --global user.email "bot@github.com"
          git add mi_lista_personal.m3u canales_disponibles.txt
          git commit -m "Auto-limpieza de canales muertos" || exit 0
          git push
